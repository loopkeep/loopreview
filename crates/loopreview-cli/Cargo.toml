[package]
name = "loopreview-cli"
description = "Terminal UI for loopreview, a review-first diff TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Two binaries — `loopreview` and its short alias `lr` — that both delegate to
# the crate's `run()`. Keeping the logic in the library avoids a duplicate build
# target on one `main.rs`.
[[bin]]
name = "loopreview"
path = "src/bin/loopreview.rs"

[[bin]]
name = "lr"
path = "src/bin/lr.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
loopreview-core = { path = "../loopreview-core" }
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }

# On Unix, route key input through /dev/tty so `git diff | lr` still reads
# keystrokes when stdin is the piped patch. These features are Unix-only; on
# Windows crossterm reads the console directly, so the base dependency is used.
[target.'cfg(unix)'.dependencies]
crossterm = { version = "0.29.0", features = ["use-dev-tty", "libc"] }
